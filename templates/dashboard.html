<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">
        <div class="mark">₹</div>
        Ledger
      </div>
      <div class="topbar-right">
        <span class="user-pill">@{{ username }}</span>
        <button id="logoutBtn" class="icon-btn">Sign out</button>
      </div>
    </div>

    <div class="content">
      <div class="summary-row">
        <div class="summary-card total">
          <div class="label">Total spent</div>
          <div class="value mono" id="summaryTotal">₹0.00</div>
          <div class="sub" id="summaryCount">0 entries</div>
        </div>
        <div class="summary-card">
          <div class="label">Top category</div>
          <div class="value mono" id="summaryTopCat">—</div>
          <div class="sub" id="summaryTopCatAmt">No expenses yet</div>
        </div>
        <div class="summary-card">
          <div class="label">Average per entry</div>
          <div class="value mono" id="summaryAvg">₹0.00</div>
          <div class="sub">Across all logged expenses</div>
        </div>
      </div>

      <div class="panel-grid">
        <div class="panel">
          <h3 id="formTitle">Add an expense</h3>
          <form id="expenseForm" class="expense-form">
            <input type="hidden" id="expenseId" value="">
            <div class="field">
              <label for="title">What was it for?</label>
              <input type="text" id="title" placeholder="Groceries, cab ride, rent…" required>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
              </div>
              <div class="field">
                <label for="date">Date</label>
                <input type="date" id="date" required>
              </div>
            </div>
            <div class="field">
              <label for="category">Category</label>
              <select id="category">
                {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="field">
              <label for="note">Note (optional)</label>
              <input type="text" id="note" placeholder="Any extra detail">
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Add expense</button>
            <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="margin-top:10px; display:none;">Cancel edit</button>
          </form>
        </div>

        <div class="panel">
          <div class="filter-row">
            <h3 style="margin:0;">Your ledger</h3>
            <select id="categoryFilter">
              <option value="All">All categories</option>
              {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div id="ledgerList" class="ledger"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
